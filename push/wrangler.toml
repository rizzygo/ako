# Worker do push da Rotina. Passo a passo para publicar em push/README.md.
name = "rotina-push"
main = "worker.mjs"
compatibility_date = "2026-11-01"
# Só o domínio próprio: o endereço *.workers.dev passaria por fora do WAF e do rate limit da zona.
workers_dev = false
routes = [{ pattern = "rotina-push.rizzygo.com.br", custom_domain = true }]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rotina-push"
database_id = "9ddbf304-dd6f-4cc8-b53d-05bf8201b7ab"

# Limite por IP dentro do Worker (decisão 0006). O namespace_id é um número qualquer, único na conta.
# Uma pessoa normal faz poucos pedidos por minuto; 20 POST por minuto por IP só barra robô.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# IA da Zumi (rota /zumi). Trocar o modelo é só mudar ZUMI_MODELO.
[ai]
binding = "AI"

[vars]
ZUMI_MODELO = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"

# Segredos (não ficam neste arquivo): VAPID_PUBLIC e VAPID_PRIVATE, com `npx wrangler secret put`.
