<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Rotina com a Zumi mudou de endereço</title>
<meta name="description" content="A Rotina com a Zumi agora fica em rotina.rizzygo.com.br.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://rotina.rizzygo.com.br/">
<meta name="theme-color" content="#0B1B3A">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ds/rizzygo.css?v=2026111020">
<script src="/ds/tema.js?v=2026111020"></script>
<style>
  body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
  .ponte { max-width: 480px; text-align: center; }
  .ponte img { width: 96px; height: 96px; }
</style>
</head>
<body>
<main class="ponte">
  <img src="/zumi/abelha-ola.png" alt="" width="96" height="96">
  <h1>A Rotina mudou de endereço</h1>
  <p>Agora ela fica em <strong>rotina.rizzygo.com.br</strong>. Estamos levando você para lá, com os dados deste aparelho.</p>
  <p><a class="btn" id="ir" href="https://rotina.rizzygo.com.br/">Abrir a Rotina</a></p>
</main>
<script>
/* Ponte para o endereço novo. O localStorage é de cada endereço: esta página lê os dados da Rotina
   deste aparelho e manda no #migrar= da URL nova. O fragmento não vai para nenhum servidor.
   Do outro lado, o migrar.js só grava o que ainda não existe lá. Spec no repositório rizzygo-rotina:
   specs/endereco-novo.md. */
(function () {
  'use strict';
  var DESTINO = 'https://rotina.rizzygo.com.br/';
  var CHAVES = ['rizzygo-rotina-v1', 'rizzygo-rotina-novidades-v1', 'rizzygo-rotina-zumi-v1', 'rizzygo-tema', 'ako-som-vitoria'];
  var LEVOU = 'rizzygo-rotina-levada';
  var PUSH = 'rizzygo-rotina-push-v1';
  var PUSH_API = 'https://rotina-push.rizzygo.com.br';

  function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var aba = location.hash && location.hash.indexOf('#/') === 0 ? location.hash : '';
  var url = DESTINO + aba;

  // O service worker antigo (cache do app) não serve mais: desliga e limpa.
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('rotina-') === 0) caches.delete(k); }); });
  } catch (e) { /* segue */ }

  // Os dados vão sempre (o outro lado só troca a Rotina que nunca foi usada lá; o resto ele não mexe).
  // LEVOU só evita avisar o Worker de novo.
  var parar = Promise.resolve();
  var dados = {}, tem = false;
  CHAVES.forEach(function (k) { var v = ler(k); if (v !== null) { dados[k] = v; if (k.indexOf('rizzygo-rotina') === 0) tem = true; } });
  var push = null;
  try { push = JSON.parse(ler(PUSH) || 'null'); } catch (e) { push = null; }
  var conta = false;
  try { conta = !!(JSON.parse(ler('rizzygo-conta-v1') || 'null') || {}).ligado; } catch (e) { conta = false; }
  if (tem) url = DESTINO + '#migrar=' + encodeURIComponent(JSON.stringify({ v: 1, dados: dados, conta: conta, push: !!(push && push.on) }));
  if (!ler(LEVOU)) {
    // Os lembretes com o app fechado deste endereço param: o aparelho liga de novo no endereço novo.
    if (push && push.id) {
      parar = Promise.race([
        fetch(PUSH_API + '/remover', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: push.id }), keepalive: true }).catch(function () {}),
        new Promise(function (r) { setTimeout(r, 1500); })
      ]);
    }
    try { localStorage.setItem(LEVOU, new Date().toISOString()); } catch (e) { /* modo privado: avisa de novo na próxima */ }
  }
  document.getElementById('ir').href = url;
  parar.then(function () { location.replace(url); });
})();
</script>
</body>
</html>
