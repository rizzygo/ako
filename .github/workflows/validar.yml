name: validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # O mesmo script que roda local: trilhas, JavaScript, segredos e tamanho dos AGENTS.md.
      - run: scripts/validar
      - name: Shell
        run: shellcheck scripts/validar scripts/previa
