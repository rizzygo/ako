name: validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trilhas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 trilhas/validar.py
      - name: JavaScript sem erro de sintaxe
        run: node --check trilhas/app.js && node --check trilhas/materiais/materiais.js
